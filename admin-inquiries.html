    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">

        <div class="logo-mark">
          <img src="https://scontent.fmnl17-5.fna.fbcdn.net/v/t39.30808-6/574903601_1244383761044499_6185672699345779707_n.jpg?stp=dst-jpg_tt6&cstp=mx1500x1500&ctp=s1500x1500&_nc_cat=111&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeF9_bgph0-v6-rJ_ySImoFND3WxF8Aa7wIPdbEXwBrvAqWFffBVusn27o6ZnrpaCeWp-FOHq7MlkBnEoDXhyeUo&_nc_ohc=rd-Cc6x5caIQ7kNvwHENFi4&_nc_oc=Adquv0xwdOBhRmNsQCgZS4j9dC4R4x7-wAPWlbKNBwSaaKRSbdg6z5Chvud_Lh_WC3c&_nc_zt=23&_nc_ht=scontent.fmnl17-5.fna&_nc_gid=O9CuI3Bt0bLQmEqPBhsrxQ&_nc_ss=7b2a8&oh=00_AQFsH8U19C3oRXII54C1v6Ti06eoyspgYK8luRkEOp7YMA&oe=6A726ABF" alt="Happy Queen's logo">
        </div>
        <div class="admin-sidebar-brand-text">
          <strong>Happy Queen's</strong>
          <span>Admin Panel</span>
        </div>
      </div>

      <nav class="admin-nav">
        <div class="admin-nav-label">Overview</div>
        <a href="admin-dashboard.html" class="admin-nav-link"><i class="fa-solid fa-gauge"></i> Dashboard</a>

        <div class="admin-nav-label">Manage</div>
        <a href="admin-orders.html" class="admin-nav-link"><i class="fa-solid fa-receipt"></i> Orders</a>
        <a href="admin-customers.html" class="admin-nav-link"><i class="fa-solid fa-users"></i> Customers</a>
        <a href="admin-inquiries.html" class="admin-nav-link is-active"><i class="fa-solid fa-envelope-open-text"></i> Inquiries</a>
        <a href="admin-services.html" class="admin-nav-link"><i class="fa-solid fa-boxes-stacked"></i> Services</a>
        <a href="template-page.html" class="admin-nav-link"><i class="fa-solid fa-images"></i> Templates</a>

        <div class="admin-nav-label">Store</div>
        <a href="client-side/html/index.html" class="admin-nav-link"><i class="fa-solid fa-arrow-up-right-from-square"></i> View Website</a>
      </nav>

      <div class="admin-sidebar-footer">
        Logged in as <strong style="color:#fff;">Admin</strong>
      </div>
    </aside>

    <div class="admin-main">

      <!-- Topbar -->
      <header class="admin-topbar">
        <div class="admin-topbar-left">
          <button type="button" class="admin-sidebar-toggle" id="adminSidebarToggle" aria-label="Toggle menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div>
            <div class="admin-page-title">Inquiries</div>
            <div class="admin-page-subtitle">Questions and quotation requests from the Contact Us form.</div>
          </div>
        </div>

        <div class="admin-topbar-right">
          <div class="admin-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Quick search...">
          </div>
          <button type="button" class="admin-icon-btn" aria-label="Notifications">
            <i class="fa-regular fa-bell"></i>
            <span class="badge-dot"></span>
          </button>
          <div class="account-menu" id="accountMenu">
            <button type="button" class="account-trigger" id="accountMenuBtn" aria-haspopup="true" aria-expanded="false">
              <span class="admin-avatar">HQ</span>
              <i class="fa-solid fa-chevron-down account-chevron"></i>
            </button>
            <div class="account-dropdown" id="accountDropdown" role="menu">
              <a href="admin-dashboard.html" class="account-dropdown-item" role="menuitem"><i class="fa-solid fa-gauge"></i> Dashboard</a>
              <a href="#" class="account-dropdown-item" role="menuitem"><i class="fa-solid fa-gear"></i> Account Settings</a>
              <div class="account-dropdown-divider"></div>
              <button type="button" class="account-dropdown-item account-dropdown-logout" id="logoutBtn" role="menuitem">
                <i class="fa-solid fa-right-from-bracket"></i> Log Out
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Content -->
      <main class="admin-content">
        <div class="admin-panel">
          <div class="admin-table-controls">
            <input type="text" id="inqSearch" class="admin-inline-search" placeholder="Search by name, contact or service...">
            <select id="inqFilter" class="admin-inline-search" style="max-width:180px;">
              <option value="">All</option><option value="new">New</option><option value="replied">Replied</option><option value="closed">Closed</option>
            </select>
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead><tr><th>Date</th><th>From</th><th>Service</th><th>Details</th><th>Files</th><th>Status</th></tr></thead>
              <tbody id="inqBody"><tr><td colspan="6" class="admin-table-empty">Loading&hellip;</td></tr></tbody>
            </table>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script>
    hqOnReady(function () {
      var body = document.getElementById('inqBody'), search = document.getElementById('inqSearch'), filter = document.getElementById('inqFilter');
      var toggle = document.getElementById('adminSidebarToggle'), sidebar = document.getElementById('adminSidebar'), list = [];
      if (toggle && sidebar) toggle.addEventListener('click', function () { sidebar.classList.toggle('is-open'); });

      function render() {
        var q = search.value.trim().toLowerCase(), st = filter.value;
        var rows = list.filter(function (i) {
          return (!st || i.status === st) && (!q || (i.name + ' ' + i.contact + ' ' + i.service).toLowerCase().indexOf(q) !== -1);
        });
        if (!rows.length) { body.innerHTML = '<tr><td colspan="6" class="admin-table-empty">' + (list.length ? 'No inquiries match.' : 'No inquiries yet.') + '</td></tr>'; return; }
        body.innerHTML = rows.map(function (i) {
          var files = (i.files || []).map(function (f) { return '<a href="' + hqEsc(hqAsset(f.path)) + '" target="_blank" rel="noopener">' + hqEsc(f.name) + '</a>'; }).join('<br>') || '&ndash;';
          return '<tr><td>' + hqDate(i.date) + '</td>' +
            '<td class="admin-cell-strong">' + hqEsc(i.name) + '<span class="admin-cell-sub">' + hqEsc(i.contact) + '</span></td>' +
            '<td>' + hqEsc(i.service) + '<span class="admin-cell-sub">Qty: ' + i.qty + '</span></td>' +
            '<td style="white-space:pre-line;max-width:320px;">' + hqEsc(i.details || '') + '</td><td>' + files + '</td>' +
            '<td><select data-id="' + i.id + '">' + ['new', 'replied', 'closed'].map(function (s) { return '<option value="' + s + '"' + (s === i.status ? ' selected' : '') + '>' + s.charAt(0).toUpperCase() + s.slice(1) + '</option>'; }).join('') + '</select></td></tr>';
        }).join('');
        body.querySelectorAll('select[data-id]').forEach(function (sel) {
          sel.addEventListener('change', async function () {
            var item = list.find(function (x) { return x.id === parseInt(sel.dataset.id, 10); });
            var r = await hqAdmin('inquiry_status', { id: item.id, status: sel.value });
            if (!r.ok) { alert(r.error || 'Could not update.'); sel.value = item.status; return; }
            item.status = sel.value;
          });
        });
      }
      search.addEventListener('input', render); filter.addEventListener('change', render);
      hqAdmin('inquiries').then(function (r) {
        if (!r.ok) { body.innerHTML = '<tr><td colspan="6" class="admin-table-empty">' + hqEsc(r.error || 'Could not load.') + '</td></tr>'; return; }
        list = r.inquiries; render();
      });
    });
  </script>

  

</body>
</html>
