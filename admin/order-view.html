<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../client-side/js/api.js"></script>
  <script src="../client-side/js/admin-common.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View product — Admin — Happy Queen's Crafty House</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="order-view.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="ov-body">

  <header class="ov-top screen-only">
    <a href="admin-orders.html" class="ov-back"><i class="fa-solid fa-arrow-left"></i> Orders</a>
    <div class="ov-title"><strong id="ovTitle">Order</strong><span id="ovSub"></span></div>
    <div class="ov-actions">
      <div class="ov-seg" id="ovFaces"></div>
      <button type="button" class="ov-btn" id="ovOpen" style="display:none;">Open card</button>
      <button type="button" class="ov-btn" id="ovReset" style="display:none;">Reset view</button>
      <input type="color" id="ovBg" value="#2b3a42" title="Background color" class="ov-color">
      <button type="button" class="ov-btn" id="ovFull"><i class="fa-solid fa-expand"></i> Full screen</button>
      <select id="ovSize" class="ov-select" title="Print size" style="display:none;"><option value="actual">Print: actual size</option><option value="fit">Print: fit to page</option></select>
      <button type="button" class="ov-btn is-primary" id="ovPrint"><i class="fa-solid fa-print"></i> Print</button>
    </div>
  </header>

  <main class="ov-main screen-only">
    <div class="ov-stage" id="ovStage"></div>
    <div class="ov-sheet" id="ovSheet" style="display:none;"></div>
    <div class="ov-msg" id="ovMsg">Loading&hellip;</div>
  </main>

  <footer class="ov-foot screen-only" id="ovFoot"></footer>

  <div class="print-area" id="printArea"></div>

  <script src="../client-side/js/design-engine.js"></script>
  <script src="../client-side/js/viewer3d.js"></script>
  <script src="order-view.js"></script>
</body>
</html>
